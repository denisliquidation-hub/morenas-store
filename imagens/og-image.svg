<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fundo creme editorial -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="55%" stop-color="#f6f2ec"/>
      <stop offset="100%" stop-color="#efe7dc"/>
    </linearGradient>
    <!-- Glow verde -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(152, 85%, 32.9%)" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="hsl(152, 80%, 31.4%)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="hsl(152, 80%, 31.4%)" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow ametista discreto -->
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(285, 60%, 60%)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="hsl(285, 60%, 60%)" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra suave -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <!-- Padrão pontilhado decorativo -->
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="hsl(152, 30%, 26.3%)" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Padrão de dots no canto inferior esquerdo -->
  <rect x="0" y="430" width="320" height="200" fill="url(#dots)" opacity="0.9"/>

  <!-- Glows -->
  <circle cx="990" cy="160" r="380" fill="url(#glow)"/>
  <circle cx="180" cy="540" r="280" fill="url(#glow2)"/>

  <!-- Moldura editorial -->
  <rect x="40" y="40" width="1120" height="550" fill="none"
        stroke="hsl(20, 14%, 18%)" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Top eyebrow -->
  <g transform="translate(80, 92)">
    <line x1="0" y1="10" x2="34" y2="10" stroke="hsl(152, 80%, 29.9%)" stroke-width="2"/>
    <text x="48" y="16" font-family="Inter, system-ui, sans-serif" font-size="15"
          font-weight="600" letter-spacing="4" fill="hsl(152, 80%, 26.8%)">COLEÇÃO 02 · LANÇAMENTO</text>
  </g>

  <!-- Marca / wordmark -->
  <g transform="translate(80, 175)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif"
          font-size="58" font-weight="700" font-style="italic" fill="hsl(20, 18%, 12%)"
          letter-spacing="-0.5">Morenas Store</text>
  </g>

  <!-- Title gigante -->
  <g transform="translate(80, 270)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif"
          font-size="118" font-weight="900" fill="hsl(20, 18%, 10%)"
          letter-spacing="-3" line-height="1">Novidades</text>
    <text x="0" y="120" font-family="'Playfair Display', Georgia, serif"
          font-size="118" font-weight="900" font-style="italic" fill="hsl(152, 80%, 28.6%)"
          letter-spacing="-3">em breve.</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 510)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif"
          font-size="24" font-style="italic" fill="hsl(20, 12%, 28%)">
      Sempre com o melhor da moda aos seus pés.
    </text>
  </g>

  <!-- Footer com domínio + cidade -->
  <g transform="translate(80, 568)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="600" letter-spacing="2.5" fill="hsl(20, 10%, 30%)">
      MORENASSTORE.COM
    </text>
    <text x="220" y="0" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="400" letter-spacing="2.5" fill="hsl(20, 10%, 45%)">
      ·  IMPERATRIZ — MA
    </text>
  </g>

  <!-- Selo circular (canto direito) -->
  <g transform="translate(960, 320)">
    <!-- Anel externo girando (estático no SVG) -->
    <circle cx="0" cy="0" r="135" fill="none"
            stroke="hsl(20, 18%, 12%)" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="0" cy="0" r="118" fill="hsl(20, 18%, 10%)"/>
    <!-- Texto curvado simulado com 3 linhas -->
    <text x="0" y="-18" text-anchor="middle"
          font-family="'Playfair Display', Georgia, serif" font-style="italic"
          font-size="22" fill="hsl(35, 30%, 92%)">coleção</text>
    <text x="0" y="22" text-anchor="middle"
          font-family="'Playfair Display', Georgia, serif"
          font-size="72" font-weight="900" fill="hsl(152, 85%, 35.3%)" letter-spacing="-2">02</text>
    <text x="0" y="56" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif" font-size="10"
          font-weight="600" letter-spacing="4" fill="hsl(35, 25%, 78%)">EM BREVE</text>

    <!-- Pulso decorativo -->
    <circle cx="0" cy="0" r="148" fill="none"
            stroke="hsl(152, 80%, 31.4%)" stroke-opacity="0.35" stroke-width="1"
            stroke-dasharray="2 6"/>
  </g>

  <!-- Dot sinaleiro discreto perto do título -->
  <g transform="translate(720, 408)">
    <circle cx="0" cy="0" r="9" fill="hsl(152, 80%, 31.4%)"/>
    <circle cx="0" cy="0" r="20" fill="none"
            stroke="hsl(152, 80%, 31.4%)" stroke-opacity="0.4"/>
  </g>

</svg>
