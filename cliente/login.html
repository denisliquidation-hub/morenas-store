<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Entrar · Morenas Store</title>
  <meta name="description" content="Acesse sua conta na Morenas Store — moda feminina · atacado e varejo · Imperatriz - MA." />

  <link rel="icon" type="image/png" href="/imagens/logo.png" />
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />

  <!-- App-like / PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/imagens/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Morenas" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('morenas-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" />

  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/auth.css" />
</head>
<body>
  <div class="auth-page">
    <header class="auth-page__nav">
      <a href="/" class="auth-page__brand" aria-label="Morenas Store">
        <img src="/imagens/logo.png" alt="" />
        <span class="auth-page__brand-name">Morenas Store</span>
      </a>
      <a href="/" class="auth-page__back">← Voltar à loja</a>
    </header>

    <main class="auth-page__main">
      <section class="auth-card">
        <div class="auth-card__eyebrow">Cliente</div>
        <h1 class="auth-card__title">Bem-vinda de <em>volta</em>.</h1>
        <p class="auth-card__sub">Acesse sua conta pra ver seus pedidos e favoritos.</p>

        <div class="auth-alert auth-alert--error" id="error" role="alert"></div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="auth-form__field">
            <label class="input-label" for="email">E-mail</label>
            <input type="email" id="email" class="input" placeholder="seu@email.com" required autocomplete="email" />
          </div>

          <div class="auth-form__field">
            <label class="input-label" for="senha">Senha</label>
            <input type="password" id="senha" class="input" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
          </div>

          <div class="auth-form__row">
            <label class="auth-form__check">
              <input type="checkbox" id="remember" checked />
              <span>Manter conectada</span>
            </label>
            <a href="https://wa.me/5599982508435?text=Ol%C3%A1!%20Esqueci%20minha%20senha%20da%20Morenas%20Store%20e%20preciso%20de%20ajuda." target="_blank" rel="noopener" class="auth-form__link">Esqueci minha senha</a>
          </div>

          <div class="auth-form__cta">
            <button type="submit" class="btn btn--brand btn--lg" id="submitBtn">Entrar</button>
          </div>
        </form>

        <div class="auth-card__divider"></div>

        <p class="auth-card__footer">
          Ainda não tem conta? <a href="/cliente/cadastro.html" class="auth-form__link">Criar conta grátis</a>
        </p>
      </section>
    </main>
  </div>

  <script type="module">
    import { supabase, getSessionAndProfile } from '/js/supabase-client.js';

    // Se já está logado, redireciona pra área logada
    const { session } = await getSessionAndProfile();
    if (session) window.location.href = '/cliente/conta.html';

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('auth-alert--show');
    }
    function clearError() {
      errorBox.classList.remove('auth-alert--show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando…';

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password: senha });

      if (error) {
        const msg = error.message === 'Invalid login credentials'
          ? 'E-mail ou senha incorretos.'
          : error.message;
        showError(msg);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        return;
      }

      window.location.href = '/cliente/conta.html';
    });
  </script>
</body>
</html>
