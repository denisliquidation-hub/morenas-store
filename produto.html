<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produto · Morenas Store</title>

  <link rel="icon" type="image/png" href="/imagens/logo.png" />
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('morenas-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" />

  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/components.css" />

  <style>
    .pdp { padding-block: var(--space-12) var(--space-20); }

    .pdp-breadcrumb {
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: var(--space-6);
    }
    .pdp-breadcrumb a {
      color: var(--text-secondary);
      transition: color var(--duration-fast) var(--easing-base);
    }
    .pdp-breadcrumb a:hover { color: var(--pink-500); }
    .pdp-breadcrumb__sep { color: var(--pink-500); margin: 0 6px; }

    .pdp__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-12);
      align-items: flex-start;
    }
    @media (max-width: 960px) {
      .pdp__grid { grid-template-columns: 1fr; gap: var(--space-8); }
    }

    .pdp__media {
      position: sticky;
      top: calc(var(--header-height) + var(--space-8));
      aspect-ratio: 4 / 5;
      background-color: var(--surface-muted);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    @media (max-width: 960px) {
      .pdp__media { position: static; }
    }
    .pdp__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pdp__tag {
      position: absolute;
      top: var(--space-4);
      left: var(--space-4);
      z-index: 1;
    }

    .pdp__info { display: flex; flex-direction: column; gap: var(--space-5); }
    .pdp__category {
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--pink-500);
      font-weight: var(--font-semibold);
    }
    .pdp__name {
      font-family: var(--font-display);
      font-size: clamp(var(--text-3xl), 5vw, var(--text-5xl));
      font-weight: var(--font-black);
      letter-spacing: var(--tracking-tight);
      line-height: 1.05;
    }
    .pdp__desire {
      font-family: var(--font-display);
      font-style: italic;
      font-size: var(--text-lg);
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .pdp__price {
      display: flex;
      align-items: baseline;
      gap: var(--space-3);
      padding: var(--space-5) 0;
      border-block: 1px solid var(--border-subtle);
    }
    .pdp__price-now {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      font-weight: var(--font-black);
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .pdp__price-was {
      font-size: var(--text-lg);
      text-decoration: line-through;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .pdp__discount {
      background: var(--pink-500);
      color: white;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      letter-spacing: var(--tracking-wide);
      padding: 3px 10px;
      border-radius: var(--radius-full);
    }
    .pdp__stock {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .pdp__stock--low { color: var(--status-warning); font-weight: var(--font-medium); }
    .pdp__stock--out { color: var(--status-error); font-weight: var(--font-medium); }

    .pdp__desc {
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-line;
    }

    .pdp__cta {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .pdp__cta .btn { width: 100%; }

    .pdp__trust {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      padding-top: var(--space-5);
      border-top: 1px solid var(--border-subtle);
    }
    .pdp__trust-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      text-align: center;
    }
    .pdp__trust-item svg { color: var(--pink-500); }
    .pdp__trust-label {
      font-size: 0.6875rem;
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: var(--font-medium);
    }

    .pdp-loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pdp-loading__spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid var(--border-default);
      border-top-color: var(--pink-500);
      animation: spin 700ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar__inner">
      <span class="top-bar__item">Moda Feminina</span>
      <span class="top-bar__sep" aria-hidden="true">·</span>
      <span class="top-bar__item">Atacado e Varejo</span>
      <span class="top-bar__sep" aria-hidden="true">·</span>
      <span class="top-bar__item top-bar__item--pink">Imperatriz - MA</span>
    </div>
  </div>

  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="Morenas Store">
        <img src="/imagens/logo.png" alt="" />
        <span class="nav__logo-text">Morenas Store</span>
      </a>
      <ul class="nav__links">
        <li><a class="nav__link" href="/">Novidades</a></li>
        <li><a class="nav__link" href="/categoria.html?slug=sandalias">Sandálias</a></li>
        <li><a class="nav__link" href="/categoria.html?slug=saltos">Saltos</a></li>
        <li><a class="nav__link" href="/categoria.html?slug=tenis">Tênis</a></li>
        <li><a class="nav__link" href="/categoria.html?slug=botas">Botas</a></li>
        <li><a class="nav__link" href="/categoria.html?slug=havaianas">Havaianas</a></li>
      </ul>
      <div class="nav__actions">
        <a class="icon-btn" href="/cliente/login.html" aria-label="Minha conta" id="accountLink">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a class="icon-btn" href="https://wa.me/5599982508435" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9s-.5-.2-.7.2c-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6 0-1.7-.8-2.8-1.5-3.9-3.4-.3-.5.3-.5.8-1.5.1-.2 0-.3 0-.5l-1-2.3c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1 2.9 1.2 3.1c.1.2 2.1 3.2 5.2 4.5 1.9.8 2.7.9 3.6.8.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4s-.3-.2-.6-.4z M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.5.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <div class="pdp-loading" id="loading">
    <div class="pdp-loading__spinner" aria-label="Carregando"></div>
  </div>

  <main class="pdp container" id="pdp" style="display: none">
    <nav class="pdp-breadcrumb" aria-label="Você está em" id="breadcrumb"></nav>

    <div class="pdp__grid">
      <div class="pdp__media" id="media">
        <span class="tag tag--pink pdp__tag" id="productTag" style="display: none"></span>
        <img id="productImage" src="" alt="" />
      </div>

      <div class="pdp__info">
        <span class="pdp__category" id="productCategory"></span>
        <h1 class="pdp__name" id="productName"></h1>
        <p class="pdp__desire" id="productDesire" style="display: none"></p>

        <div class="pdp__price">
          <span class="pdp__price-now" id="productPrice"></span>
          <span class="pdp__price-was" id="productPriceOld" style="display: none"></span>
          <span class="pdp__discount" id="productDiscount" style="display: none"></span>
        </div>

        <p class="pdp__stock" id="productStock"></p>

        <div class="pdp__desc" id="productDesc" style="display: none"></div>

        <div class="pdp__cta">
          <a class="btn btn--pink btn--lg" id="waCta" href="#" target="_blank" rel="noopener">
            Comprar pelo WhatsApp
          </a>
          <a class="btn btn--secondary btn--lg" href="https://wa.me/5599982508435?text=Ol%C3%A1!%20Tenho%20d%C3%BAvidas%20sobre%20um%20produto" target="_blank" rel="noopener">
            Tirar dúvidas
          </a>
        </div>

        <div class="pdp__trust">
          <div class="pdp__trust-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span class="pdp__trust-label">Entrega rápida</span>
          </div>
          <div class="pdp__trust-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.7 1 6.4 2.6L21 8"/><path d="M21 3v5h-5"/></svg>
            <span class="pdp__trust-label">Troca em 30 dias</span>
          </div>
          <div class="pdp__trust-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4-8-12V5l8-3 8 3v5c0 8-8 12-8 12z"/><path d="m9 12 2 2 4-4"/></svg>
            <span class="pdp__trust-label">Pagamento seguro</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from '/js/supabase-client.js';

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (!slug) { window.location.href = '/'; throw new Error('no slug'); }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function fmtPreco(n) { return 'R$ ' + Number(n).toFixed(2).replace('.', ','); }

    const TAG_LABELS = {
      'novo': { label: 'Novo', cls: 'tag--pink' },
      'mais-vendido': { label: 'Mais vendido', cls: 'tag--black' },
      'edicao-limitada': { label: 'Edição limitada', cls: 'tag--soft' },
      'pre-venda': { label: 'Pré-venda', cls: 'tag--soft' },
      'lancamento-02': { label: 'Lançamento 02', cls: 'tag--pink' },
      'promocao': { label: 'Promoção', cls: 'tag--pink' },
      'exclusivo': { label: 'Exclusivo', cls: 'tag--black' },
    };

    // Busca produto + categoria
    const { data: produto, error } = await supabase
      .from('produtos').select('*').eq('slug', slug).eq('ativo', true).single();

    if (error || !produto) {
      document.getElementById('loading').innerHTML =
        '<div style="text-align: center"><p style="color: var(--text-muted); margin-bottom: var(--space-4)">Produto não encontrado.</p><a class="btn btn--pink" href="/">Voltar à loja</a></div>';
      throw new Error('not found');
    }

    document.title = `${produto.nome} · Morenas Store`;
    const meta = document.querySelector('meta[name="description"]');
    if (produto.desejo) {
      const m = document.createElement('meta');
      m.name = 'description';
      m.content = produto.desejo;
      document.head.appendChild(m);
    }

    // Categoria
    let categoria = null;
    if (produto.categoria_id) {
      const { data } = await supabase
        .from('categorias').select('id, nome, slug, parent_id').eq('id', produto.categoria_id).single();
      categoria = data;
    }

    // Breadcrumb
    const bc = document.getElementById('breadcrumb');
    let bcHtml = '<a href="/">Início</a>';
    if (categoria) {
      // Se tem parent, mostra também
      if (categoria.parent_id) {
        const { data: parent } = await supabase
          .from('categorias').select('nome, slug').eq('id', categoria.parent_id).single();
        if (parent) {
          bcHtml += `<span class="pdp-breadcrumb__sep">/</span><a href="/categoria.html?slug=${encodeURIComponent(parent.slug)}">${escapeHtml(parent.nome)}</a>`;
        }
      }
      bcHtml += `<span class="pdp-breadcrumb__sep">/</span><a href="/categoria.html?slug=${encodeURIComponent(categoria.slug)}">${escapeHtml(categoria.nome)}</a>`;
    }
    bcHtml += `<span class="pdp-breadcrumb__sep">/</span>${escapeHtml(produto.nome)}`;
    bc.innerHTML = bcHtml;

    // Imagem
    const img = document.getElementById('productImage');
    img.src = produto.imagem_url || '/imagens/logo.png';
    img.alt = produto.nome;
    img.style.objectPosition = produto.imagem_position || 'center center';

    // Tag
    if (produto.tag && TAG_LABELS[produto.tag]) {
      const tag = TAG_LABELS[produto.tag];
      const el = document.getElementById('productTag');
      el.textContent = tag.label;
      el.className = `tag ${tag.cls} pdp__tag`;
      el.style.display = '';
    }

    document.getElementById('productCategory').textContent = categoria?.nome || '';
    document.getElementById('productName').textContent = produto.nome;

    if (produto.desejo) {
      const d = document.getElementById('productDesire');
      d.textContent = produto.desejo;
      d.style.display = '';
    }

    document.getElementById('productPrice').textContent = fmtPreco(produto.preco);
    if (produto.preco_antigo) {
      document.getElementById('productPriceOld').textContent = fmtPreco(produto.preco_antigo);
      document.getElementById('productPriceOld').style.display = '';
      const pct = Math.round((1 - produto.preco / produto.preco_antigo) * 100);
      const d = document.getElementById('productDiscount');
      d.textContent = `-${pct}%`;
      d.style.display = '';
    }

    const stock = document.getElementById('productStock');
    if (produto.estoque === 0) {
      stock.textContent = 'Esgotado — entre na lista de espera no WhatsApp';
      stock.className = 'pdp__stock pdp__stock--out';
    } else if (produto.estoque <= 3) {
      stock.textContent = `Últimas ${produto.estoque} unidades em estoque`;
      stock.className = 'pdp__stock pdp__stock--low';
    } else {
      stock.textContent = `${produto.estoque} unidades disponíveis`;
    }

    if (produto.descricao) {
      const desc = document.getElementById('productDesc');
      desc.textContent = produto.descricao;
      desc.style.display = '';
    }

    // CTA WhatsApp com mensagem pré-preenchida
    const waMsg = encodeURIComponent(
      `Olá! Quero comprar o ${produto.nome} — ${fmtPreco(produto.preco)}.\n\n${window.location.href}`
    );
    document.getElementById('waCta').href = `https://wa.me/5599982508435?text=${waMsg}`;

    // Mostrar
    document.getElementById('loading').remove();
    document.getElementById('pdp').style.display = '';

    // Account link
    try {
      const { getSessionAndProfile } = await import('/js/supabase-client.js');
      const { session, profile } = await getSessionAndProfile();
      if (session) {
        const link = document.getElementById('accountLink');
        if (link) link.href = profile?.role === 'admin' ? '/admin/dashboard.html' : '/cliente/conta.html';
      }
    } catch (_) {}
  </script>
</body>
</html>
